<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Wing Bank Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/wb-logo.svg">
</head>

<body class="login">
    <!-- Decorative background -->
    <div class="login-bg" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
        <div class="grid-overlay"></div>
    </div>

    <main class="card login-card">
        <div class="login-logo-wrap">
            <img src="/static/img/wb-logo.svg" alt="Wing Bank" class="login-logo">
        </div>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to the Admin Panel</p>

        {% if error %}
        <div class="error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/login">
            <div class="field">
                <label for="username">Username</label>
                <div class="field-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input id="username" name="username" placeholder="Enter your username" autocomplete="username"
                        required autofocus>
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="field-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input id="password" type="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                    <button type="button" class="toggle-pw" aria-label="Show or hide password" title="Show password">
                        <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary login-btn" type="submit">
                Sign In
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </button>
        </form>

        <p class="login-tagline">The Bank for every Cambodian</p>
    </main>

    <script>
        // Password visibility toggle
        const toggle = document.querySelector('.toggle-pw');
        toggle.addEventListener('click', () => {
            const pw = document.getElementById('password');
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            toggle.classList.toggle('on', show);
            toggle.title = show ? 'Hide password' : 'Show password';
        });
    </script>
</body>

</html>
